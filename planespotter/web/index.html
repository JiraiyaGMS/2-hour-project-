<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>planespotter</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="panel">
    <header class="brand">
      <div class="logo">plane<span>spotter</span></div>
      <div class="home-line"><span class="zone-dot"></span><span id="home-line">Loading…</span></div>
      <div class="sky-line" id="sky-line" hidden></div>
      <div class="sounds">
        <button id="btn-chime" class="chime" aria-pressed="false" title="Play a chime when a plane is about to fly over">🔕 Chime</button>
        <button id="btn-voice" class="chime" aria-pressed="false" title="Say which plane is coming, from where, and where to look">🔇 Voice</button>
      </div>
    </header>

    <div class="tabs" role="tablist">
      <button role="tab" data-tab="live" aria-selected="true">In the air <span class="count" id="live-count">0</span></button>
      <button role="tab" data-tab="history" aria-selected="false">Spotted <span class="count" id="history-count">0</span></button>
      <button role="tab" data-tab="collection" aria-selected="false">Collection</button>
      <button role="tab" data-tab="noise" aria-selected="false">Noise</button>
    </div>

    <div class="tools" id="tools">
      <div class="search">
        <input id="search" type="search" autocomplete="off"
               placeholder="Search flights, airlines, airports, aircraft">
      </div>
      <div class="filters" id="history-filters" hidden>
        <button class="chip" data-days="1" aria-pressed="false">24 hours</button>
        <button class="chip" data-days="7" aria-pressed="true">7 days</button>
        <button class="chip" data-days="30" aria-pressed="false">30 days</button>
        <button class="chip" data-days="0" aria-pressed="false">All</button>
        <select id="sort" aria-label="Sort">
          <option value="newest">Newest</option>
          <option value="closest">Closest</option>
          <option value="lowest">Lowest</option>
        </select>
      </div>
    </div>

    <div id="upnext" class="upnext" hidden aria-live="polite"></div>
    <div id="list" class="list" role="list"></div>
  </aside>

  <main id="map-wrap">
    <div id="map"></div>
    <div id="status" class="status"><span class="dot"></span><span id="status-text">Connecting…</span></div>
    <div class="map-controls">
      <div class="seg" role="group" aria-label="Map view">
        <button id="btn-3d" aria-pressed="true">3D</button>
        <button id="btn-2d" aria-pressed="false">2D</button>
      </div>
      <button id="btn-heat" class="round" title="Heat map of the busiest flight paths" aria-label="Heat map" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
      </button>
      <button id="btn-replay" class="round" title="Replay a day" aria-label="Replay a day" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </button>
      <button id="btn-ar" class="round" title="Sky view: point your phone at the sky to see which plane is which" aria-label="Sky view (AR)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M12 7.5l1.2 2.6 2.8.3-2.1 1.9.6 2.8-2.5-1.5-2.5 1.5.6-2.8-2.1-1.9 2.8-.3z"/></svg>
      </button>
      <button id="btn-home" class="round" title="Back to home" aria-label="Back to home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg>
      </button>
    </div>
    <div class="legend" id="legend">
      <span><i style="background:var(--accent)"></i>Over your zone</span>
      <span><i style="background:var(--blue)"></i>Nearby</span>
      <span><i style="background:var(--select)"></i>Selected</span>
    </div>
    <section id="lookup" class="lookup" hidden aria-live="polite"></section>
    <section id="detail" class="detail" hidden></section>
    <section id="replay" class="replay" hidden aria-label="Replay a day">
      <div class="replay-row">
        <button id="replay-play" class="round" aria-label="Play">▶</button>
        <select id="replay-day" aria-label="Day"></select>
        <select id="replay-speed" aria-label="Speed">
          <option value="60">1 min / sec</option>
          <option value="300" selected>5 min / sec</option>
          <option value="900">15 min / sec</option>
        </select>
        <span id="replay-clock" class="replay-clock">00:00</span>
        <button id="replay-close" class="close" aria-label="Close replay">×</button>
      </div>
      <input id="replay-slider" type="range" min="0" max="86400" step="30" value="0" aria-label="Time of day">
      <div id="replay-note" class="replay-note"></div>
    </section>
    <section id="heat-panel" class="heat-panel" hidden aria-label="Heat map">
      <div class="heat-head">
        <strong>Busiest flight paths</strong>
        <select id="heat-days" aria-label="Time range">
          <option value="1">Today</option>
          <option value="7">7 days</option>
          <option value="30">30 days</option>
          <option value="0">All time</option>
        </select>
      </div>
      <div class="heat-scale"><span>Quiet</span><div class="heat-bar"></div><span>Busy</span></div>
      <div id="heat-note" class="heat-note"></div>
      <div id="heat-actions" class="heat-actions"></div>
      <div id="heat-routes" class="heat-routes"></div>
    </section>
  </main>
</div>

<div id="overlay" class="overlay" hidden role="dialog" aria-modal="true">
  <div class="sheet">
    <button class="close" data-action="close-overlay" aria-label="Close">×</button>
    <div id="overlay-body"></div>
  </div>
</div>
<input id="photo-input" type="file" accept="image/*" hidden>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/deck.gl@9.0.38/dist.min.js"></script>
<script src="app.js"></script>
</body>
</html>

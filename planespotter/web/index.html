<!-- /icons -->
<div id="app">
  <aside id="panel" aria-label="Flights">
    <button id="grab" class="grab" aria-label="Make the list bigger or smaller"><span></span></button>
    <header class="brand">
      <div class="brand-row">
        <div class="logo">
          <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="var(--brand)"/><path fill="#fff" transform="rotate(45 32 32) translate(9.6 9.6) scale(.7)" d="M32 3c2.1 0 3.5 2.4 3.5 5.6v14.7l21.7 12.9v5.9L35.5 35.3v12.6l7.3 5.6v4.9L32 55.6l-10.8 2.8v-4.9l7.3-5.6V35.3L6.8 42.1v-5.9l21.7-12.9V8.6C28.5 5.4 29.9 3 32 3z"/></svg>
          <span>plane<b>spotter</b></span>
        </div>
        <div class="sounds">
          <button id="btn-chime" class="tool" aria-pressed="false" title="Play a chime when a plane is about to fly over" aria-label="Chime"></button>
          <button id="btn-voice" class="tool" aria-pressed="false" title="Say which plane is coming, from where, and where to look" aria-label="Voice"></button>
          <button id="btn-travel" class="tool" title="Travel mode: watch wherever you are for a couple of days" aria-label="Travel mode" hidden></button>
        </div>
      </div>
      <div class="home-line"><span class="zone-dot"></span><span id="home-line">Loading…</span>
        <select id="place" class="place" aria-label="Which place" hidden></select></div>
      <div class="conditions" id="conditions">
        <div class="sky-line" id="sky-line" hidden></div>
        <div class="sky-line flow-line" id="flow-line" hidden></div>
        <div class="sky-lines" id="outlook-line" hidden></div>
        <div class="travel-line" id="travel-line" hidden></div>
      </div>
    </header>

    <div class="tabs" role="tablist">
      <button role="tab" data-tab="live" aria-selected="true"><svg class="ic" aria-hidden="true"><use href="#i-radar"/></svg><span class="tab-name">In the air</span><span class="count" id="live-count">0</span></button>
      <button role="tab" data-tab="history" aria-selected="false"><svg class="ic" aria-hidden="true"><use href="#i-binoculars"/></svg><span class="tab-name">Spotted</span><span class="count" id="history-count">0</span></button>
      <button role="tab" data-tab="collection" aria-selected="false"><svg class="ic" aria-hidden="true"><use href="#i-trophy"/></svg><span class="tab-name">Collection</span></button>
      <button role="tab" data-tab="noise" aria-selected="false"><svg class="ic" aria-hidden="true"><use href="#i-noise"/></svg><span class="tab-name">Noise</span></button>
    </div>

    <div class="tools" id="tools">
      <div class="search-row">
        <label class="search">
          <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
          <input id="search" type="search" autocomplete="off" placeholder="Search flights, airlines, airports">
        </label>
        <button id="btn-track" class="btn-icon" title="Track a flight anywhere in the world" aria-label="Track a flight"><svg class="ic" aria-hidden="true"><use href="#i-route"/></svg><span>Track</span></button>
        <button id="btn-point" class="btn-icon" hidden title="Point your phone at a plane to find out what it is" aria-label="Point at a plane"><svg class="ic" aria-hidden="true"><use href="#i-telescope"/></svg><span>Point</span></button>
      </div>
      <div class="filters" id="history-filters" hidden>
        <div class="chips" role="group" aria-label="How far back">
          <button class="chip" data-days="1" aria-pressed="false">24 h</button>
          <button class="chip" data-days="7" aria-pressed="true">7 days</button>
          <button class="chip" data-days="30" aria-pressed="false">30 days</button>
          <button class="chip" data-days="0" aria-pressed="false">All</button>
        </div>
        <label class="select"><svg class="ic" aria-hidden="true"><use href="#i-sort"/></svg>
          <select id="sort" aria-label="Sort">
            <option value="newest">Newest</option>
            <option value="closest">Closest</option>
            <option value="lowest">Lowest</option>
          </select></label>
      </div>
    </div>

    <div id="upnext" class="upnext" hidden aria-live="polite"></div>
    <div id="list" class="list" role="list"></div>
  </aside>

  <main id="map-wrap">
    <div id="map"></div>
    <div id="status" class="status"><span class="dot"></span><span id="status-text">Connecting…</span></div>
    <div class="map-controls">
      <div class="seg" role="group" aria-label="Map view">
        <button id="btn-3d" aria-pressed="true">3D</button>
        <button id="btn-2d" aria-pressed="false">2D</button>
      </div>
      <button id="btn-heat" class="round" title="Heat map of the busiest flight paths" aria-label="Heat map" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-flame"/></svg></button>
      <button id="btn-replay" class="round" title="Replay a day" aria-label="Replay a day" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-history"/></svg></button>
      <button id="btn-ar" class="round" title="Sky view: point your phone at the sky to see which plane is which" aria-label="Sky view (AR)"><svg class="ic" aria-hidden="true"><use href="#i-scan"/></svg></button>
      <button id="btn-home" class="round" title="Back to home" aria-label="Back to home"><svg class="ic" aria-hidden="true"><use href="#i-locate"/></svg></button>
    </div>
    <div class="legend" id="legend">
      <span><i style="background:var(--accent)"></i>Over your zone</span>
      <span><i style="background:var(--blue)"></i>Nearby</span>
      <span><i style="background:var(--select)"></i>Selected</span>
    </div>
    <section id="lookup" class="lookup" hidden aria-live="polite"></section>
    <div id="kiosk-clock" class="kiosk-clock" hidden></div>
    <section id="kiosk-next" class="kiosk-next" hidden></section>
    <section id="detail" class="detail" hidden aria-label="Flight details"></section>
    <section id="replay" class="replay" hidden aria-label="Replay a day">
      <div class="replay-row">
        <button id="replay-play" class="round" aria-label="Play"><svg class="ic" aria-hidden="true"><use href="#i-play"/></svg></button>
        <select id="replay-day" aria-label="Day"></select>
        <input id="replay-date" type="date" aria-label="Any day" hidden>
        <select id="replay-speed" aria-label="Speed">
          <option value="60">1 min / sec</option>
          <option value="300" selected>5 min / sec</option>
          <option value="900">15 min / sec</option>
        </select>
        <button id="replay-record" class="chip" title="Save the replay as a video you can share"></button>
        <span id="replay-clock" class="replay-clock">00:00</span>
        <button id="replay-close" class="close" aria-label="Close replay"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
      </div>
      <input id="replay-slider" type="range" min="0" max="86400" step="30" value="0" aria-label="Time of day">
      <div id="replay-note" class="replay-note"></div>
    </section>
    <section id="heat-panel" class="heat-panel" hidden aria-label="Heat map">
      <div class="heat-head">
        <strong>Busiest flight paths</strong>
        <select id="heat-days" aria-label="Time range">
          <option value="1">Today</option>
          <option value="7">7 days</option>
          <option value="30">30 days</option>
          <option value="0">All time</option>
        </select>
      </div>
      <div class="heat-scale"><span>Quiet</span><div class="heat-bar"></div><span>Busy</span></div>
      <div id="heat-note" class="heat-note"></div>
      <div id="heat-actions" class="heat-actions"></div>
      <div id="heat-routes" class="heat-routes"></div>
    </section>
  </main>
</div>

<div id="overlay" class="overlay" hidden role="dialog" aria-modal="true">
  <div class="sheet">
    <button class="close" data-action="close-overlay" aria-label="Close"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
    <div id="overlay-body"></div>
  </div>
</div>
<input id="photo-input" type="file" accept="image/*" hidden>
<input id="photos-input" type="file" accept="image/*" multiple hidden>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/deck.gl@9.0.38/dist.min.js"></script>
<script src="app.js"></script>
</body>
</html>

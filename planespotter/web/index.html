<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>planespotter</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="panel">
    <header class="brand">
      <div class="logo">plane<span>spotter</span></div>
      <div class="home-line"><span class="zone-dot"></span><span id="home-line">Loading…</span></div>
    </header>

    <div class="tabs" role="tablist">
      <button role="tab" data-tab="live" aria-selected="true">In the air <span class="count" id="live-count">0</span></button>
      <button role="tab" data-tab="history" aria-selected="false">Spotted <span class="count" id="history-count">0</span></button>
    </div>

    <div class="tools">
      <div class="search">
        <input id="search" type="search" autocomplete="off"
               placeholder="Search flights, airlines, airports, aircraft">
      </div>
      <div class="filters" id="history-filters" hidden>
        <button class="chip" data-days="1" aria-pressed="false">24 hours</button>
        <button class="chip" data-days="7" aria-pressed="true">7 days</button>
        <button class="chip" data-days="30" aria-pressed="false">30 days</button>
        <button class="chip" data-days="0" aria-pressed="false">All</button>
        <select id="sort" aria-label="Sort">
          <option value="newest">Newest</option>
          <option value="closest">Closest</option>
          <option value="lowest">Lowest</option>
        </select>
      </div>
    </div>

    <div id="list" class="list" role="list"></div>
  </aside>

  <main id="map-wrap">
    <div id="map"></div>
    <div id="status" class="status"><span class="dot"></span><span id="status-text">Connecting…</span></div>
    <div class="map-controls">
      <div class="seg" role="group" aria-label="Map view">
        <button id="btn-3d" aria-pressed="true">3D</button>
        <button id="btn-2d" aria-pressed="false">2D</button>
      </div>
      <button id="btn-heat" class="round" title="Heat map of the busiest flight paths" aria-label="Heat map" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
      </button>
      <button id="btn-home" class="round" title="Back to home" aria-label="Back to home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg>
      </button>
    </div>
    <div class="legend" id="legend">
      <span><i style="background:var(--accent)"></i>Over your zone</span>
      <span><i style="background:var(--blue)"></i>Nearby</span>
      <span><i style="background:var(--select)"></i>Selected</span>
    </div>
    <section id="detail" class="detail" hidden></section>
    <section id="heat-panel" class="heat-panel" hidden aria-label="Heat map">
      <div class="heat-head">
        <strong>Busiest flight paths</strong>
        <select id="heat-days" aria-label="Time range">
          <option value="1">Today</option>
          <option value="7">7 days</option>
          <option value="30">30 days</option>
          <option value="0">All time</option>
        </select>
      </div>
      <div class="heat-scale"><span>Quiet</span><div class="heat-bar"></div><span>Busy</span></div>
      <div id="heat-note" class="heat-note"></div>
      <div id="heat-actions" class="heat-actions"></div>
      <div id="heat-routes" class="heat-routes"></div>
    </section>
  </main>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/deck.gl@9.0.38/dist.min.js"></script>
<script src="app.js"></script>
</body>
</html>

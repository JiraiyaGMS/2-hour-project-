<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#05080c">
  <title>Sky view · planespotter</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
  <style>
    :root { --accent: #ffb020; --blue: #6cb8ff; --ink: #e8edf3; --muted: #9aa7b6; --panel: rgba(12, 17, 24, .82); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #05080c; color: var(--ink); overflow: hidden;
      font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-user-select: none; user-select: none; touch-action: none; }
    #cam, #sky { position: fixed; inset: 0; width: 100%; height: 100%; }
    #cam { object-fit: cover; background: linear-gradient(#0b1a33, #1d3557 60%, #2b2d42); }
    #cam[hidden] { display: none; }
    .bar { position: fixed; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 10px;
      padding: max(10px, env(safe-area-inset-top)) 12px 10px; background: linear-gradient(rgba(0,0,0,.55), transparent); }
    .bar a { color: var(--ink); text-decoration: none; font-weight: 650; background: var(--panel); border-radius: 99px; padding: 6px 12px; }
    #facing { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 650; background: var(--panel); border-radius: 99px; padding: 6px 12px; }
    .start { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; background: #05080c; z-index: 5; }
    .start[hidden] { display: none; }
    .start .box { max-width: 420px; text-align: center; }
    .start h1 { margin: 0 0 8px; font-size: 26px; }
    .start p { color: var(--muted); margin: 0 0 14px; }
    button.go { font: inherit; font-weight: 700; font-size: 17px; border: 0; border-radius: 99px; padding: 12px 26px;
      background: var(--accent); color: #111; cursor: pointer; }
    .start a { color: var(--blue); }
    .hint { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      background: var(--panel); border-radius: 99px; padding: 6px 14px; font-size: 13px; color: var(--muted); white-space: nowrap;
      max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; }
    .card { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); max-width: 420px; margin: 0 auto;
      background: var(--panel); border: 1px solid rgba(255,255,255,.12); border-radius: 14px; padding: 12px 14px; z-index: 3;
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
    .card[hidden] { display: none; }
    .card h2 { margin: 0; font-size: 20px; }
    .card .sub { color: var(--muted); font-size: 13.5px; }
    .card .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .card button { font: inherit; font-size: 13.5px; font-weight: 650; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08);
      color: var(--ink); border-radius: 99px; padding: 6px 12px; cursor: pointer; }
    .card button.done { border-color: #2fbf71; background: rgba(47,191,113,.2); }
    .card .x { position: absolute; top: 6px; right: 8px; border: 0; background: none; font-size: 22px; padding: 2px 8px; }
    .tools { position: fixed; right: 12px; bottom: calc(60px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; z-index: 2; }
    .tools button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--panel); color: var(--ink); font: 700 18px/1 inherit; cursor: pointer; }
  </style>
</head>
<body>
  <video id="cam" playsinline muted autoplay hidden></video>
  <canvas id="sky"></canvas>
  <div class="bar"><a href="./">← Map</a><span id="facing">—</span></div>
  <div class="tools">
    <button id="zoom-in" title="Labels too far apart? Zoom in" aria-label="Narrower view">+</button>
    <button id="zoom-out" title="Labels too close together? Zoom out" aria-label="Wider view">−</button>
  </div>
  <div class="hint" id="hint">Loading…</div>
  <section class="card" id="card" hidden></section>
  <div class="start" id="start">
    <div class="box">
      <h1>✈ Sky view</h1>
      <p id="start-text">Hold your phone up to the sky and see the name of every plane, right where it is.
        Your phone will ask to use the camera and motion sensors; nothing leaves your phone except to planespotter on your own computer.</p>
      <button class="go" id="go">Start</button>
      <p id="start-note" style="margin-top:14px"></p>
    </div>
  </div>
  <script src="sky.js"></script>
</body>
</html>
